# Maverick Jellyfin Complete stack, for Docker Compose or Portainer.
#
# Docker Compose:  docker compose up -d   (in the folder holding this file)
# Portainer:       Stacks → Add stack → Web editor: paste this file, then Deploy the stack.
#
# The image is built and published by this repository. ":latest" is the newest release; a version such as ":0.5.0"
# stays on that release; ":main" is the newest code between releases. To run your own build instead, run
#   docker build -t maverick-jellyfin-complete:local .
# in a copy of this repository and change the image line to maverick-jellyfin-complete:local.
#
# Jellyfin's address and API key are entered on the setup page at first launch, not here.
# Dry run is on until you turn it off in Settings: until then every change waits in Review, and only what you approve is applied.

services:
  maverick-jellyfin-complete:
    image: ghcr.io/ambient-home-systems/jellyfin-complete:latest
    container_name: maverick-jellyfin-complete
    restart: unless-stopped
    ports:
      - "8097:8097"          # change the left side if 8097 is taken on the host
    environment:
      TZ: America/New_York   # your timezone; seeds the app's setting on first start (then change it in Settings)
      LOG_LEVEL: info
      # TRUST_PROXY: "1"     # only behind a reverse proxy that adds HTTPS; see docs/REVERSE-PROXY.md
      # SETUP_CODE: ""       # choose the first-run setup code instead of reading it from the log
      # FFMPEG_PATH: /usr/local/bin/ffmpeg   # optional: an ffmpeg you mount in, for frames when Jellyfin has no trickplay previews
    volumes:
      - maverick-config:/config   # database, encrypted keys (secret.key), logs
      # Optional, read-only: your media folder, so Library health can read each new file's own title (then turn it
      # on in Settings → Run and review → Media files). The app's user (uid 1000) must be able to read the files.
      # - /path/to/your/media:/media:ro
    security_opt:
      - no-new-privileges:true

volumes:
  maverick-config:
