<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Poster overlays (ADR-039): fonts come only from this folder, so the image needs no system fonts or fontconfig setup. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/maverick-fontconfig</cachedir>
</fontconfig>
